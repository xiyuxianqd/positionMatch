server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: position-match
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/position_match?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 200
        thread-name-prefix: async-task-

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  jwt-secret-key: abcdefghijklmnopqrstuvwxyz

recommendation:
  python:
    api:
      url: http://localhost:8000
  cache:
    expire:
      hours: 1
  model:
    training:
      lock:
        timeout:
          minutes: 30
